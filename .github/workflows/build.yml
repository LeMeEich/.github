name: Build

on:
  workflow_call:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        uses: LeMeEich/.github/.github/actions/Build/gerenate-version@master
        with:
          run_number: ${{ github.run_number }}

      - name: Build Application
        uses: LeMeEich/.github/.github/actions/Build/script@master
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: |
            build/info.txt
            teste.txt
          retention-days: 30

      - name: Build summary
        run: |
          echo "### 🎉 Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: ${{ steps.version.outputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Deploy este Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Acesse [Actions → Deploy](.LeMeEich/.github/.LeMeEich/.github/actions/workflows/deploy.yml)" >> $GITHUB_STEP_SUMMARY@master
          echo "2. Clique em **Run workflow**" >> $GITHUB_STEP_SUMMARY
          echo "3. Cole o Run ID: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Escolha o ambiente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  deploy-des:
    name: Auto Deploy to DES
    runs-on: ubuntu-latest
    needs: build
    environment: des
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Deploy to DES
        uses: LeMeEich/.github/.github/actions/Deploy/script@master
        with:
          environment: des
          version: ${{ needs.build.outputs.version }}